services:
  - type: web
    name: twitter-emotion-analysis-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: TWITTER_MAX_RESULTS
        value: "50"
      - key: FRONTEND_ORIGINS
        sync: false
